name: Descarga precio de hoy

on:
  workflow_dispatch:
  schedule:
    # Preserve the publication windows and add checks between them for recovery.
    - cron: '15 7,10,13,16,19 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: fuel-price-update
  cancel-in-progress: false

env:
  GASOLINA_CHAT_ID: ${{ secrets.GASOLINA_CHAT_ID }}
  DIESEL_CHAT_ID: ${{ secrets.DIESEL_CHAT_ID }}
  TOKEN_TELEGRAM: ${{ secrets.TOKEN_TELEGRAM }}

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Barataria prices
        id: barataria
        continue-on-error: true
        run: npm run download-today
        env:
          FUEL_STATION_ID: 5205

      - name: Download Plaza de Toros prices
        id: plaza
        continue-on-error: true
        run: npm run download-today
        env:
          FUEL_STATION_ID: 5143
          DATA_FILE: ./data-5143.json

      - name: Commit price history with push retries
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data.json data-5143.json

          if git diff --cached --quiet; then
            echo "changes_detected=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore(data): update fuel prices"

          for attempt in 1 2 3; do
            if git push origin "HEAD:master"; then
              echo "changes_detected=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Push failed after $attempt attempts" >&2
              if [ "${{ steps.pages.outcome }}" = "failure" ]; then
            echo "::error::GitHub Pages deployment could not be triggered."
          fi
          exit 1
            fi

            echo "Push attempt $attempt failed; rebasing on the latest master"
            git fetch origin master
            git rebase origin/master
          done

      - name: Trigger GitHub Pages deployment
        id: pages
        continue-on-error: true
        if: steps.commit.outputs.changes_detected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run static.yml --ref master

      - name: Send Telegram notifications
        if: steps.commit.outputs.changes_detected == 'true'
        run: npm run send
        env:
          DATA_FILE_2: ./data-5143.json
          STATION_NAME_1: Barataria
          STATION_NAME_2: Plaza de Toros

      - name: Report station download failures
        if: always() && (steps.barataria.outcome == 'failure' || steps.plaza.outcome == 'failure' || steps.pages.outcome == 'failure')
        shell: bash
        run: |
          if [ "${{ steps.barataria.outcome }}" = "failure" ]; then
            echo "::error::Barataria (5205) download failed."
          fi
          if [ "${{ steps.plaza.outcome }}" = "failure" ]; then
            echo "::error::Plaza de Toros (5143) download failed."
          fi
          exit 1

name: Descarga precio de hoy

on:
  workflow_dispatch:
  schedule:
    # Keep the daytime polling window to catch both Geoportal price publications.
    - cron: '0 7-17 * * *'

permissions:
  contents: write

concurrency:
  group: fuel-price-update
  cancel-in-progress: false

env:
  GASOLINA_CHAT_ID: ${{ secrets.GASOLINA_CHAT_ID }}
  DIESEL_CHAT_ID: ${{ secrets.DIESEL_CHAT_ID }}
  TOKEN_TELEGRAM: ${{ secrets.TOKEN_TELEGRAM }}

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Barataria prices
        run: npm run download-today
        env:
          FUEL_STATION_ID: 5205

      - name: Download Plaza de Toros prices
        run: npm run download-today
        env:
          FUEL_STATION_ID: 5143
          DATA_FILE: ./data-5143.json

      - name: Commit price history
        id: commit
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          commit_message: 'chore(data): update fuel prices'
          file_pattern: 'data.json data-5143.json'

      - name: Send Telegram notifications
        if: steps.commit.outputs.changes_detected == 'true'
        run: npm run send
        env:
          DATA_FILE_2: ./data-5143.json
          STATION_NAME_1: Barataria
          STATION_NAME_2: Plaza de Toros
